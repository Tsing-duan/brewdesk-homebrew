name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-tests:
    name: Source, tests, and external builds
    runs-on: macos-26
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24 without implicit package-manager cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Record the actual macOS 26 image and toolchains
        shell: bash
        run: |
          printf 'ImageOS=%s\n' "${ImageOS:-unknown}"
          printf 'ImageVersion=%s\n' "${ImageVersion:-unknown}"
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          node --version
          npm --version
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc --version --verbose
          cargo --version --verbose
          rustfmt --version
          cargo clippy --version
      - name: Install exact JavaScript dependencies
        run: npm ci
      - name: Verify local Tauri and dependency contracts
        shell: bash
        run: |
          ./node_modules/.bin/tauri --version
          node -e 'const p=require("./package.json"); const l=require("./package-lock.json"); if(p.devDependencies["@tauri-apps/cli"]!=="2.11.4"||l.packages["node_modules/@tauri-apps/cli"].version!=="2.11.4") process.exit(1)'
          node -e 'const l=require("./package-lock.json"); if(l.packages["node_modules/nanoid"].version!=="3.3.18"||l.packages["node_modules/postcss"].version!=="8.5.24") process.exit(1)'
          npm audit --audit-level=moderate
      - name: Verify CI and shell contracts
        run: |
          node scripts/verify-ci-contract.mjs
          npm run test:ci-contract
          npm run test:build-boundaries
          npm run test:app-verifier
      - name: Run frontend tests
        run: npm test
      - name: Build web and native helpers outside the repository
        shell: bash
        run: |
          install -d -m 700 "$RUNNER_TEMP/brewdesk-build"
          PUBLIC_BUILD_ROOT="$RUNNER_TEMP/brewdesk-build" npm run build
          PUBLIC_BUILD_ROOT="$RUNNER_TEMP/brewdesk-build" npm run build:native-helpers
      - name: Verify Rust source and tests outside the repository
        shell: bash
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/brewdesk-cargo-target"
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Audit Rust dependencies with fixed cargo-audit
        shell: bash
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/cargo-audit"
          "$RUNNER_TEMP/cargo-audit/bin/cargo-audit" --version
          "$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --color never --db "$RUNNER_TEMP/rustsec-advisory-db" --file src-tauri/Cargo.lock --json > "$RUNNER_TEMP/cargo-audit.json"
          node -e 'const a=require(process.env.RUNNER_TEMP+"/cargo-audit.json"); console.log(JSON.stringify({database:a.database,vulnerabilities:a.vulnerabilities,warnings:Object.fromEntries(Object.entries(a.warnings||{}).map(([k,v])=>[k,v.length]))})); if(a.vulnerabilities.count!==0) process.exit(1)'
          git -C "$RUNNER_TEMP/rustsec-advisory-db" rev-parse HEAD
          git -C "$RUNNER_TEMP/rustsec-advisory-db" show -s --format=%cI HEAD

  application-contract:
    name: External application build and Info.plist contract
    runs-on: macos-26
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24 without implicit package-manager cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install exact build contracts
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          npm ci
          ./node_modules/.bin/tauri --version
      - name: Build and verify ad-hoc application outside the repository
        shell: bash
        run: |
          install -d -m 700 "$RUNNER_TEMP/brewdesk-app-build"
          PUBLIC_BUILD_ROOT="$RUNNER_TEMP/brewdesk-app-build" npm run app:build

  secret-scan:
    name: Dynamic Canary and complete Git history scan
    runs-on: macos-26
    env:
      GITLEAKS_VERSION: "8.30.0"
    steps:
      - name: Checkout complete history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download and verify official Gitleaks archive
        shell: bash
        run: |
          install -d -m 700 "$RUNNER_TEMP/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/gitleaks/checksums.txt" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/gitleaks/archive.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          expected_sha=$(awk '$2 == "gitleaks_8.30.0_darwin_arm64.tar.gz" { print $1 }' "$RUNNER_TEMP/gitleaks/checksums.txt")
          actual_sha=$(shasum -a 256 "$RUNNER_TEMP/gitleaks/archive.tar.gz" | awk '{ print $1 }')
          test -n "$expected_sha"
          test "$actual_sha" = "$expected_sha"
          tar -xzf "$RUNNER_TEMP/gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          test "$("$RUNNER_TEMP/gitleaks/gitleaks" version)" = "$GITLEAKS_VERSION"
          shasum -a 256 "$RUNNER_TEMP/gitleaks/archive.tar.gz" "$RUNNER_TEMP/gitleaks/gitleaks"
      - name: Run dynamic hit and no-hit Canary
        run: python3 scripts/gitleaks-canary.py --binary "$RUNNER_TEMP/gitleaks/gitleaks" --config .gitleaks.toml --temp-parent "$RUNNER_TEMP"
      - name: Scan working tree and complete Git history
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --config .gitleaks.toml --redact=100 --no-color --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks-working-tree.json" .
          "$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml --redact=100 --no-color --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks-history.json" .
