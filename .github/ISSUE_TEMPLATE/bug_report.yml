name: Bug report
description: Report a reproducible BrewDesk defect without private data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, proxy credentials, private inventories, tester identities, recipient data, or private manifests. Security issues follow SECURITY.md."
  - type: input
    id: revision
    attributes:
      label: BrewDesk revision
      description: Commit SHA or source archive identifier
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: macOS and CPU
      placeholder: "macOS 26.x, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Include the action and package kind, but remove private paths and credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private inventories, identities, recipient data, private manifests, and sensitive absolute paths.
          required: true
